<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-icon-180.png" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/arkadLight.svg"
      media="(prefers-color-scheme: dark)"
    />

      rel="icon"

      href="/arkadDark.svg"
      media="(prefers-color-scheme: light)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <meta name="theme-color" content="#060312" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ARKAD" />
    <meta
      name="description"
      content="Arkad es una plataforma web para el registro, gestión y calificación de videojuegos presentados por estudiantes de Ingeniería de Sistemas en la Feria Gamer Uninorte, Arkad ofrece un entorno completo para profesores, jurados y estudiantes."
    />
    <title>Arkad</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
