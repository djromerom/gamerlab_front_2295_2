name: Deploy-front
on:
  # Trigger the workflow on push to dev-deploy or main branches
  # By default, dev-deploy and main branches are protected, so only approved PRs can trigger the workflow
  push:
    branches: [ dev-deploy , main ]

  # Allow manual triggering of the workflow with a specified target branch (dev-deploy or main)
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch target (dev-deploy or main)'
        required: true
        type: choice
        options:
          - dev-deploy
          - main

jobs:
  # Job to build and push the Docker image, tagged based on the branch and commit SHA
  docker-image:
      runs-on: ubuntu-latest
      outputs:
        tag-name: ${{  steps.resolve-tag.outputs.tag  }}
        branch: ${{  steps.resolve-tag.outputs.branch  }}
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Resolve deploy tag
          id: resolve-tag
          run: |
            set -euo pipefail
            BRANCH="${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}"
            if [ -z "$BRANCH" ]; then
              echo "ERROR: branch could not be resolved"
              exit 1
            fi
            echo "Resolved branch: $BRANCH"
            
            IMAGE_SUFFIX=$(echo "$BRANCH_IMAGE_TAGS" | jq -r ".\"$BRANCH\".tag")
            if [ "$IMAGE_SUFFIX" = "null" ] || [ -z "$IMAGE_SUFFIX" ]; then
              echo "ERROR: No image suffix configured for branch '$BRANCH'"
              exit 1
            fi
            TAG="sha-${GITHUB_SHA::7}-${IMAGE_SUFFIX}"
            echo "Resolved image tag: $TAG"
  
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          env:
            BRANCH_IMAGE_TAGS: ${{ secrets.BRANCH_IMAGE_TAGS }}

        - name: Resolve VITE_secrets
          id: resolve-secrets
          run: |
            set -euo pipefail
            if [ "${{ steps.resolve-tag.outputs.branch }}" = "dev-deploy" ]; then
              echo "Using dev secrets"
              echo "VITE_ENDPOINT_BACKEND=${{ secrets.VITE_ENDPOINT_BACKEND_TEST_TEMP }}" >> $GITHUB_ENV
              echo "VITE_SITE_KEY=${{ secrets.VITE_SITE_KEY_TEMP }}" >> $GITHUB_ENV
            elif [ "${{ steps.resolve-tag.outputs.branch }}" = "main" ]; then
              echo "Using prod secrets"
              echo "VITE_ENDPOINT_BACKEND=${{ secrets.VITE_ENDPOINT_BACKEND_PROD_TEMP }}" >> $GITHUB_ENV
              echo "VITE_SITE_KEY=${{ secrets.VITE_SITE_KEY_TEMP }}" >> $GITHUB_ENV
            else
              echo "ERROR: Unrecognized branch '${{ steps.resolve-tag.outputs.branch }}'"
              exit 1
            fi
            
        - name: Build and push base image
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${{ steps.resolve-tag.outputs.tag }}
            push: true
            no-cache: true
            secrets: |
              "VITE_ENDPOINT_BACKEND=$VITE_ENDPOINT_BACKEND"
              "VITE_SITE_KEY=$VITE_SITE_KEY"      

  # Conditional job to dispatch repository events for test deployment (dev-deploy branch)
  test-dispatch:
    needs: docker-image
    if: needs.docker-image.outputs.branch == 'dev-deploy'
    runs-on: ubuntu-latest
    steps:


      - name: Dispatch_send
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{  secrets.DEPLOY_PAT  }}
          repository: ${{  secrets.REPO_DISPATCH_TARGET  }}
          event-type: test-image-published
          client-payload: |
            {
              "tag": "${{  needs.docker-image.outputs.tag-name  }}"
            }
            
  # Conditional job to dispatch repository events for production deployment (main branch)
  prod-dispatch:
    needs: docker-image
    if: needs.docker-image.outputs.branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch_send
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{  secrets.DEPLOY_PAT  }}
          repository: ${{  secrets.REPO_DISPATCH_TARGET  }}
          event-type: prod-image-published
          client-payload: |
            {
              "tag": "${{  needs.docker-image.outputs.tag-name  }}"
            }
