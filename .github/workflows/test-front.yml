name: Test-front
on:
  # Trigger the workflow on pull request to dev-deploy or main branches
  pull_request:
    branches: [ dev-deploy , main ]

jobs:
  # Job to build and run unit tests on the front end codebase
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      # Variables de entorno ordenadas (ARK-43): lo usado en el codigo esta documentado en .env.example,
      # cada variable explica que es / como obtenerla / como rotarla, y no hay .env, llaves, etc. versionados.
      # TODO: arrancó como aviso; quitar continue-on-error (y marcarlo como check requerido) cuando pase limpio un sprint.
      - name: Check environment variables docs
        run: |
          npm run check:env:test
          npm run check:env
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      # El script build ya hace el chequeo de tipos (tsc -b) antes de vite build
      - name: Build
        run: npm run build

      # TODO: la deuda actual de lint impide hacerlo bloqueante; quitar continue-on-error cuando se limpie.
      - name: Lint
        run: npx eslint .
        continue-on-error: true

      # Bloqueante: sin continue-on-error, una prueba en rojo deja el PR en rojo.
      # --reporter=verbose lista cada prueba en el log para revisar que corrieron (no "0 tests").
      - name: Run tests
        run: npm run test:ci