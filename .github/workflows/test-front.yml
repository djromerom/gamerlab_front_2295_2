name: Test-front
on:
  # Trigger the workflow on pull request to dev-deploy or main branches
  pull_request:
    branches: [ dev-deploy , main ]

jobs:
  # Job to build and run unit tests on the front end codebase
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # Placeholder for testing steps, e.g., installing dependencies and running unit tests