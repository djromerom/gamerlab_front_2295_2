name: Deploy-test

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ dev-deploy ]

  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
       
  docker-image:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Creation of the SHA tag 
          uses: docker/metadata-action@v5
          id: sha-tag
          with:
            images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}
            tags: type=sha,prefix=sha-,suffix=-frontend_dev

        - name: Build and push base image
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./apps/${{ matrix.services }}/Dockerfile 
            tags: ${{ steps.sha-tag.outputs.tags }}
            platforms: linux/arm64
            push: true
            no-cache: true
            secrets: |
              "VITE_ENDPOINT_BACKEND=${{  secrets.VITE_ENDPOINT_BACKEND_TEST_TEMP  }}"
              "VITE_SITE_KEY=${{  secrets.VITE_SITE_KEY_TEMP  }}"
