name: Deploy-test

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ dev-deploy ]


permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            npm run test:main
          else
            echo "run testing"
          fi
       
  docker-image:
      runs-on: ubuntu-latest
      needs: test  
      if: github.ref == 'refs/heads/dev-deploy' && success()
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Git Pull
          run: git pull
        - name: Read and bump version
          id: versioning
          run: |
            VERSION_FILE=version.txt
            if [ ! -f "$VERSION_FILE" ]; then
              echo 0 > $VERSION_FILE
            fi
            VERSION=$(cat $VERSION_FILE)
            echo "Current version: v$VERSION"
            echo "version=v$VERSION" >> $GITHUB_OUTPUT
            echo $((VERSION + 1)) > $VERSION_FILE

        - name: Git Auto Commit
          uses: stefanzweifel/git-auto-commit-action@v5.2.0
          with:
            commit_message: Update version.txt
            branch: dev-deploy
            commit_user_name: CamiloDlRM [GITHUB-ACTIONS]
            commit_user_email: zinbak78@gmail.com
            commit_author: CamiloDlRM <zinbak78@gmail.com>
            
        - name: Log in to Docker Hub
          run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
        - name: Clean Docker cache
          run: docker system prune -f
        - name: build image
          run: docker build  --build-arg VITE_ENDPOINT_BACKEND=${{ secrets.VITE_ENDPOINT_BACKEND_TEST_TEMP }} --build-arg VITE_SITE_KEY=${{ secrets.VITE_SITE_KEY_TEST_TEMP }} -f Dockerfile.prod -t arkadfront-prod-image . || { echo "Docker build failed"; exit 1; }
        - name: Debug values
          run: |
              echo "Username defined: ${{ secrets.DOCKERHUB_USERNAME != '' }}"
              echo "Repository defined: ${{ secrets.DOCKERHUB_REPOSITORY != '' }}"
              echo "Version: ${{ steps.versioning.outputs.version }}"
        - name: Tag Docker image
          run: |
            docker tag arkadfront-prod-image ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:arkadfront-prod-${{ steps.versioning.outputs.version }}
        - name: Push the image to Docker Hub
          run: | 
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:arkadfront-prod-${{ steps.versioning.outputs.version }}
