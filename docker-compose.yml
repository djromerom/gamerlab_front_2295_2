version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_ENDPOINT_BACKEND: ${VITE_ENDPOINT_BACKEND}
        VITE_SITE_KEY: ${VITE_SITE_KEY}
    image: gamerlab-frontend:latest
    ports:
      - ${FRONTEND_HOST_PORT:-5173}:5173 # map host port (default 5173) to container port 5173
    environment:
      - NODE_ENV=production
    restart: unless-stopped
