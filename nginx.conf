server {
    listen 80;
    server_name localhost; 
    
    client_max_body_size 500M;
    
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # index.html nunca se guarda en caché: así cada despliegue llega a todos
    # (los archivos de /assets llevan hash y sí se pueden cachear).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Manifest de la PWA (ARK-198): tipo correcto y sin caché larga
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires off;
        try_files $uri /index.html;
    }

    # Cache static files for performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
 }

    error_page 404 /index.html;
}
